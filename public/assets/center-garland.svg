<svg viewBox="-160 -35 320 70" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%; filter: drop-shadow(0 4px 12px rgba(25,75,120,0.1));">
  <defs>
    <!-- Multi-Tone Hydrangea Petal Gradients -->
    <radialGradient id="cg_hNavy" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4a95db"/>
      <stop offset="65%" stop-color="#185998"/>
      <stop offset="100%" stop-color="#0e345c"/>
    </radialGradient>
    <radialGradient id="cg_hBlue1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9dd0fb"/>
      <stop offset="55%" stop-color="#3b8fe0"/>
      <stop offset="100%" stop-color="#175ea5"/>
    </radialGradient>
    <radialGradient id="cg_hBlue2" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e3f3ff"/>
      <stop offset="45%" stop-color="#80c1fa"/>
      <stop offset="100%" stop-color="#3283d4"/>
    </radialGradient>
    <radialGradient id="cg_hBlue3" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#b6defd"/>
      <stop offset="100%" stop-color="#559ee7"/>
    </radialGradient>

    <!-- Watercolor Foliage Gradients -->
    <linearGradient id="cg_leafDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9cdab8"/>
      <stop offset="55%" stop-color="#419369"/>
      <stop offset="100%" stop-color="#1b5b38"/>
    </linearGradient>
    <linearGradient id="cg_leafSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cdeee0"/>
      <stop offset="60%" stop-color="#6bb891"/>
      <stop offset="100%" stop-color="#2d754e"/>
    </linearGradient>

    <!-- 4-Petal Floret Templates -->
    <g id="cg_floretDeep">
      <path d="M0 0 C -4 -4, -7 -13, 0 -16 C 7 -13, 4 -4, 0 0 Z" fill="url(#cg_hNavy)"/>
      <path d="M0 0 C 4 -4, 13 -7, 16 0 C 13 7, 4 4, 0 0 Z" fill="url(#cg_hBlue1)"/>
      <path d="M0 0 C 4 4, 7 13, 0 16 C -7 13, -4 4, 0 0 Z" fill="url(#cg_hNavy)"/>
      <path d="M0 0 C -4 4, -13 7, -16 0 C -13 -7, -4 -4, 0 0 Z" fill="url(#cg_hBlue1)"/>
      <circle cx="0" cy="0" r="2.2" fill="#ffffff" opacity="0.95"/>
      <circle cx="0" cy="0" r="1.1" fill="#e0a030"/>
    </g>

    <g id="cg_floretMid">
      <path d="M0 0 C -4 -4, -7 -13, 0 -16 C 7 -13, 4 -4, 0 0 Z" fill="url(#cg_hBlue1)"/>
      <path d="M0 0 C 4 -4, 13 -7, 16 0 C 13 7, 4 4, 0 0 Z" fill="url(#cg_hBlue2)"/>
      <path d="M0 0 C 4 4, 7 13, 0 16 C -7 13, -4 4, 0 0 Z" fill="url(#cg_hBlue1)"/>
      <path d="M0 0 C -4 4, -13 7, -16 0 C -13 -7, -4 -4, 0 0 Z" fill="url(#cg_hBlue2)"/>
      <circle cx="0" cy="0" r="2" fill="#ffffff" opacity="0.95"/>
      <circle cx="0" cy="0" r="0.9" fill="#3283d4"/>
    </g>

    <g id="cg_floretLight">
      <path d="M0 0 C -4 -4, -6 -12, 0 -15 C 6 -12, 4 -4, 0 0 Z" fill="url(#cg_hBlue2)"/>
      <path d="M0 0 C 4 -4, 12 -6, 15 0 C 12 6, 4 4, 0 0 Z" fill="url(#cg_hBlue3)"/>
      <path d="M0 0 C 4 4, 6 12, 0 15 C -6 12, -4 4, 0 0 Z" fill="url(#cg_hBlue2)"/>
      <path d="M0 0 C -4 4, -12 6, -15 0 C -12 -6, -4 -4, 0 0 Z" fill="url(#cg_hBlue3)"/>
      <circle cx="0" cy="0" r="2" fill="#ffffff" opacity="0.98"/>
      <circle cx="0" cy="0" r="0.9" fill="#e8af3c"/>
    </g>
  </defs>

  <!-- 1. Background Eucalyptus Foliage (Symmetrical Outward Stretch) -->
  <g>
    <!-- Left Leaves -->
    <path d="M -40 0 C -70 -18, -120 -15, -150 -5 C -120 12, -75 10, -40 0 Z" fill="url(#cg_leafDeep)" opacity="0.85"/>
    <path d="M -30 4 C -65 14, -105 22, -135 15 C -105 -2, -65 0, -30 4 Z" fill="url(#cg_leafSoft)" opacity="0.8"/>
    <!-- Right Leaves -->
    <path d="M 40 0 C 70 -18, 120 -15, 150 -5 C 120 12, 75 10, 40 0 Z" fill="url(#cg_leafDeep)" opacity="0.85"/>
    <path d="M 30 4 C 65 14, 105 22, 135 15 C 105 -2, 65 0, 30 4 Z" fill="url(#cg_leafSoft)" opacity="0.8"/>
  </g>

  <!-- 2. Base Deep Florets -->
  <g>
    <use href="#cg_floretDeep" x="-22" y="-6" transform="rotate(-15, -22, -6) scale(0.9)"/>
    <use href="#cg_floretDeep" x="22" y="-6" transform="rotate(15, 22, -6) scale(0.9)"/>
    <use href="#cg_floretDeep" x="-60" y="-2" transform="rotate(25, -60, -2) scale(0.85)"/>
    <use href="#cg_floretDeep" x="60" y="-2" transform="rotate(-25, 60, -2) scale(0.85)"/>
    <use href="#cg_floretDeep" x="-85" y="4" transform="rotate(-10, -85, 4) scale(0.75)"/>
    <use href="#cg_floretDeep" x="85" y="4" transform="rotate(10, 85, 4) scale(0.75)"/>
  </g>

  <!-- 3. Mid Hydrangea Florets -->
  <g>
    <use href="#cg_floretMid" x="-14" y="8" transform="rotate(12, -14, 8) scale(0.95)"/>
    <use href="#cg_floretMid" x="14" y="8" transform="rotate(-12, 14, 8) scale(0.95)"/>
    <use href="#cg_floretMid" x="-45" y="5" transform="rotate(-20, -45, 5) scale(0.9)"/>
    <use href="#cg_floretMid" x="45" y="5" transform="rotate(20, 45, 5) scale(0.9)"/>
    <use href="#cg_floretMid" x="-72" y="-4" transform="rotate(15, -72, -4) scale(0.8)"/>
    <use href="#cg_floretMid" x="72" y="-4" transform="rotate(-15, 72, -4) scale(0.8)"/>
  </g>

  <!-- 4. Center Highlight Florets -->
  <g>
    <use href="#cg_floretLight" x="0" y="0" transform="rotate(5, 0, 0) scale(1.15)"/>
    <use href="#cg_floretLight" x="-28" y="-2" transform="rotate(-8, -28, -2) scale(0.95)"/>
    <use href="#cg_floretLight" x="28" y="-2" transform="rotate(8, 28, -2) scale(0.95)"/>
    <use href="#cg_floretLight" x="-95" y="0" transform="rotate(30, -95, 0) scale(0.7)"/>
    <use href="#cg_floretLight" x="95" y="0" transform="rotate(-30, 95, 0) scale(0.7)"/>
  </g>

  <!-- 5. Floating Accent Petals -->
  <g>
    <path d="M -115 -14 C -120 -18, -127 -15, -125 -8 C -118 -4, -112 -7, -115 -14 Z" fill="url(#cg_hBlue2)" opacity="0.85"/>
    <path d="M 115 -14 C 120 -18, 127 -15, 125 -8 C 118 -4, 112 -7, 115 -14 Z" fill="url(#cg_hBlue2)" opacity="0.85"/>
    <path d="M -138 12 C -143 8, -150 11, -147 17 C -141 21, -135 18, -138 12 Z" fill="url(#cg_hBlue3)" opacity="0.85"/>
    <path d="M 138 12 C 143 8, 150 11, 147 17 C 141 21, 135 18, 138 12 Z" fill="url(#cg_hBlue3)" opacity="0.85"/>
  </g>
</svg>
